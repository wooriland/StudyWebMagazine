<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1130" viewBox="0 0 520 1130" role="img" aria-labelledby="title description">
  <title id="title">RNN의 시간별 반복 계산, 모바일 세로 배치</title>
  <desc id="description">시간이 위에서 아래로 진행됩니다. 초기 상태 h0와 입력 x1로 h1, 다음 입력 x2와 h1로 h2, 다음 입력 x3와 h2로 h3를 계산합니다. 모든 시점은 하나의 RNN 계층의 같은 가중치와 편향을 공유합니다.</desc>
  <defs>
    <marker id="state-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10Z" fill="#0f6875"/></marker>
    <marker id="input-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10Z" fill="#235f85"/></marker>
    <style>
      text { font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
      .title { font-size: 30px; font-weight: 750; fill: #1f2933; }
      .copy { font-size: 24px; fill: #566573; }
      .time { font-size: 24px; font-weight: 700; fill: #566573; }
      .symbol { font-family: Consolas, 'Liberation Mono', monospace; font-size: 36px; font-weight: 700; }
      .cell-title { font-size: 34px; font-weight: 750; fill: #075363; }
      .cell-copy { font-size: 24px; fill: #075363; }
      .note { font-size: 25px; fill: #554696; }
      .state { fill: none; stroke: #0f6875; stroke-width: 3; marker-end: url(#state-arrow); }
    </style>
  </defs>
  <rect width="520" height="1130" rx="20" fill="#fff"/>
  <text x="30" y="51" class="title">SimpleRNN의 시간 전개</text>
  <text x="30" y="89" class="copy">시간은 위에서 아래로 진행 ↓</text>

  <g text-anchor="middle">
    <text x="322" y="144" class="symbol" fill="#0f6875">h₀</text>
    <text x="217" y="142" class="copy">초기 상태</text>
  </g>
  <path d="M322 157V216" class="state"/>

  <!-- The state travels vertically; current inputs arrive from the left. -->
  <g fill="#e6f1f4" stroke="#7faeb7" stroke-width="2">
    <rect x="218" y="220" width="208" height="128" rx="18"/>
    <rect x="218" y="432" width="208" height="128" rx="18"/>
    <rect x="218" y="644" width="208" height="128" rx="18"/>
  </g>
  <g text-anchor="middle">
    <text x="322" y="269" class="cell-title">RNN</text><text x="322" y="312" class="cell-copy">같은 순환 계산</text>
    <text x="322" y="481" class="cell-title">RNN</text><text x="322" y="524" class="cell-copy">같은 순환 계산</text>
    <text x="322" y="693" class="cell-title">RNN</text><text x="322" y="736" class="cell-copy">같은 순환 계산</text>
  </g>

  <g text-anchor="middle">
    <text x="91" y="235" class="time">t = 1</text>
    <text x="91" y="447" class="time">t = 2</text>
    <text x="91" y="659" class="time">t = 3</text>
    <g fill="#edf6fc" stroke="#bad7e8" stroke-width="1.5">
      <rect x="34" y="251" width="114" height="66" rx="14"/>
      <rect x="34" y="463" width="114" height="66" rx="14"/>
      <rect x="34" y="675" width="114" height="66" rx="14"/>
    </g>
    <g class="symbol" fill="#235f85">
      <text x="91" y="296">x₁</text><text x="91" y="508">x₂</text><text x="91" y="720">x₃</text>
    </g>
  </g>
  <g fill="none" stroke="#235f85" stroke-width="3" marker-end="url(#input-arrow)">
    <path d="M149 284H214"/><path d="M149 496H214"/><path d="M149 708H214"/>
  </g>

  <path d="M322 351V428" class="state"/>
  <path d="M322 563V640" class="state"/>
  <path d="M322 775V837" class="state"/>
  <g class="symbol" fill="#0f6875">
    <text x="345" y="401">h₁</text><text x="345" y="613">h₂</text>
  </g>
  <rect x="239" y="841" width="166" height="66" rx="14" fill="#f2eff9" stroke="#dcd5ed"/>
  <text x="322" y="886" class="symbol" fill="#554696" text-anchor="middle">h₃</text>
  <text x="322" y="941" class="copy" text-anchor="middle">마지막 출력·상태</text>

  <!-- This shared-weight bracket has no arrowhead to distinguish it from state flow. -->
  <path d="M437 284H468V958M437 496H468M437 708H468" fill="none" stroke="#9383b8" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="24" y="961" width="472" height="139" rx="16" fill="#f2eff9" stroke="#dcd5ed"/>
  <g text-anchor="middle" class="note">
    <text x="260" y="1002" font-weight="750">모든 시점에서 같은 가중치 공유</text>
    <text x="260" y="1041" font-weight="750">Wₓ · Wₕ · b</text>
    <text x="260" y="1080">하나의 RNN을 시간축으로 펼친 모습</text>
  </g>
</svg>

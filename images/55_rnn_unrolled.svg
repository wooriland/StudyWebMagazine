<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">시간 방향으로 펼친 RNN의 반복 계산</title>
  <desc id="description">초기 은닉 상태 h0와 첫 입력 x1로 h1을 계산합니다. 같은 RNN 계산이 x2와 h1로 h2를, x3와 h2로 h3를 계산합니다. 세 시점은 입력 가중치 Wx, 순환 가중치 Wh, 편향 b를 공유하는 하나의 RNN 계층입니다.</desc>
  <defs>
    <marker id="state-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#0f6875"/></marker>
    <marker id="input-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#235f85"/></marker>
    <marker id="time-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#8196a3"/></marker>
    <style>
      text { font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
      .title { font-size: 28px; font-weight: 750; fill: #1f2933; }
      .copy { font-size: 20px; fill: #566573; }
      .time { font-size: 19px; font-weight: 700; fill: #566573; }
      .symbol { font-family: Consolas, 'Liberation Mono', monospace; font-size: 29px; font-weight: 700; }
      .cell-title { font-size: 28px; font-weight: 750; fill: #075363; }
      .cell-copy { font-size: 19px; fill: #075363; }
      .note { font-size: 20px; fill: #554696; }
      .state { fill: none; stroke: #0f6875; stroke-width: 3; marker-end: url(#state-arrow); }
    </style>
  </defs>
  <rect width="1200" height="620" rx="20" fill="#fff"/>
  <text x="44" y="53" class="title">SimpleRNN의 시간 전개</text>
  <text x="44" y="88" class="copy">현재 입력 + 이전 은닉 상태 → 새로운 은닉 상태</text>

  <!-- The time axis is separate from the actual state connections. -->
  <path d="M247 131H971" fill="none" stroke="#a5b7c1" stroke-width="2" marker-end="url(#time-arrow)"/>
  <rect x="502" y="111" width="196" height="38" rx="19" fill="#fff"/>
  <text x="600" y="137" text-anchor="middle" class="time">시간 진행 · t →</text>

  <!-- Each input enters the repeated computation at its own time step. -->
  <g text-anchor="middle">
    <text x="310" y="185" class="time">t = 1</text>
    <text x="600" y="185" class="time">t = 2</text>
    <text x="890" y="185" class="time">t = 3</text>
    <g fill="#edf6fc" stroke="#bad7e8" stroke-width="1.5">
      <rect x="253" y="201" width="114" height="58" rx="14"/>
      <rect x="543" y="201" width="114" height="58" rx="14"/>
      <rect x="833" y="201" width="114" height="58" rx="14"/>
    </g>
    <g fill="#235f85" class="symbol">
      <text x="310" y="240">x₁</text><text x="600" y="240">x₂</text><text x="890" y="240">x₃</text>
    </g>
  </g>
  <g fill="none" stroke="#235f85" stroke-width="3" marker-end="url(#input-arrow)">
    <path d="M310 259V305"/><path d="M600 259V305"/><path d="M890 259V305"/>
  </g>

  <!-- Identical cells represent shared parameters, not separate layers. -->
  <g fill="#e6f1f4" stroke="#7faeb7" stroke-width="2">
    <rect x="210" y="308" width="200" height="114" rx="18"/>
    <rect x="500" y="308" width="200" height="114" rx="18"/>
    <rect x="790" y="308" width="200" height="114" rx="18"/>
  </g>
  <g text-anchor="middle">
    <text x="310" y="354" class="cell-title">RNN</text>
    <text x="600" y="354" class="cell-title">RNN</text>
    <text x="890" y="354" class="cell-title">RNN</text>
    <text x="310" y="389" class="cell-copy">같은 순환 계산</text>
    <text x="600" y="389" class="cell-copy">같은 순환 계산</text>
    <text x="890" y="389" class="cell-copy">같은 순환 계산</text>
  </g>

  <path d="M82 368H206" class="state"/>
  <path d="M414 368H496" class="state"/>
  <path d="M704 368H786" class="state"/>
  <path d="M994 368H1109" class="state"/>
  <g text-anchor="middle" fill="#0f6875" class="symbol">
    <text x="139" y="344">h₀</text><text x="455" y="344">h₁</text><text x="745" y="344">h₂</text>
  </g>
  <text x="139" y="405" text-anchor="middle" class="copy">초기 은닉 상태</text>
  <text x="1070" y="344" text-anchor="middle" class="symbol" fill="#554696">h₃</text>
  <text x="1070" y="405" text-anchor="middle" class="copy">마지막 출력·상태</text>

  <!-- Dashed bracket denotes shared weights; it is not a data-flow arrow. -->
  <path d="M310 439V467H890V439M600 439V492" fill="none" stroke="#9383b8" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="180" y="492" width="840" height="88" rx="16" fill="#f2eff9" stroke="#dcd5ed"/>
  <text x="600" y="527" text-anchor="middle" class="note" font-weight="750">모든 시점에서 같은 Wₓ · Wₕ · b 공유</text>
  <text x="600" y="559" text-anchor="middle" class="note">세 개의 계층이 아니라, 하나의 RNN을 시간축으로 펼친 모습</text>
</svg>
